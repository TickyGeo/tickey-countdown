<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <img src="1.webp" class="image" alt="Subaru">
        <h2>Subaru</h2>
        <h4>В наличии</h4>
        <p>Subaru – легендарные, динамичные, безопасные и надежные автомобили, собираемые в Японии. Надежность
            автомобилей Subaru подтверждают крупнейшие из авторитетных мировых рейтингов надежности.</p>
        <div class="countdown">
            <div class="countdown-item">
                <h4 class="days">10</h4>
                <span>Days</span>
            </div>
            <div class="countdown-item">
                <h4 class="hours">23</h4>
                <span>Hours</span>
            </div>
            <div class="countdown-item">
                <h4 class="minutes">59</h4>
                <span>Minutes</span>
            </div>
            <div class="countdown-item">
                <h4 class="seconds">25</h4>
                <span>Seconds</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
